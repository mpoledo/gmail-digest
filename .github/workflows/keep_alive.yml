name: Keep Workflows Alive

on:
  schedule:
    - cron: "0 12 1 * *"  # primer dia de cada mes
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit vacio para mantener workflows activos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep workflows active"
          git push
